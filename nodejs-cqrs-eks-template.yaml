apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: cqrs-eks-template
  title: Design pattern CQRS on EKS
  description: >
    Create an API-first Node.js EKS service ({name}-app) with optional CQRS writer/reader workloads,
    a message-driven worker, Crossplane infra under infra/, and Helm charts in the team GitOps chart platform repository.
  links:
    - url: https://github.com/orgs/ab-inbev-ze-company/repositories?q=chart-platform&type=&language=&sort=
      title: GitHub — team GitOps chart platform repositories
      icon: github
    - url: https://github.com/ab-inbev-ze-company/template-backstage-eks-nodejs-cqrs-app
      title: Node.js CQRS application template source
      icon: github
  tags:
    - eks
    - kubernetes
    - nodejs
    - typescript
    - nestjs
    - cqrs
    - microservice
    - aws
    - golden-pipeline
    - crossplane
    - gitops
    - helm
    - argocd
spec:
  owner: group:foundations/platform-engineering
  type: service

  parameters:
    - title: Project Info
      required:
        - name
        - description
        - costCenter
        - costEnv
      properties:
        name:
          type: string
          title: Project Name
          description: >
            Repository key (max 25 characters). One GitHub repository is created — {name}-app — with
            application sources at the repo root and Crossplane / platform infra assets under infra/.
          maxLength: 25
          minLength: 3
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          ui:autofocus: true
          ui:help: "Max 25 characters. Lowercase letters, numbers, hyphens only. Do not add an '-app' suffix."

        description:
          title: Description
          type: string
          description: Brief description of the service
          default: "Node.js CQRS API for EKS"

        costCenter:
          title: Cost Center
          type: string
          description: Financial cost center used for cloud allocation
          default: platform

        costEnv:
          title: Cost Environment
          type: string
          enum: [dev, sit, prod]
          default: dev

        costShared:
          title: Shared Cost
          type: boolean
          description: Set true when this workload uses shared platform resources
          default: false

    - title: Team and GitOps
      required:
        - owner
        - environments
        - gitopsChartRepo
      properties:
        owner:
          title: Owner
          type: string
          description: Owning squad
          ui:field: SquadOwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
            sort: alphabetical
            teamPathsOnly: true

        environments:
          title: Target deployment track
          type: string
          description: >
            SIT integration vs optional PR ephemeral workloads. Chart values live under .../dev in the platform repo.
          enum: ['sit', 'sit-ephemeral']
          enumNames: ['SIT Only', 'SIT + Ephemeral']
          default: 'sit'

        gitopsChartRepo:
          title: GitOps Helm chart repository
          type: string
          ui:field: GitOpsChartRepoPicker
          ui:readonly: true
          description: GitOps chart platform selected automatically from the owner
          default: performance-consumer-chart-platform

        gitopsBranch:
          title: GitOps target branch
          type: string
          default: "main"
          pattern: "^[a-z0-9][a-z0-9._/-]*$"

    - title: Runtime architecture
      required:
        - cqrsArchitecture
      properties:
        cqrsArchitecture:
          title: Runtime architecture
          type: string
          enum: [standard, cqrs]
          enumNames:
            - Standard API (monolith)
            - CQRS (separate writer and reader HTTP workloads)
          default: standard
          ui:widget: radio
      dependencies:
        cqrsArchitecture:
          oneOf:
            - properties:
                cqrsArchitecture:
                  const: standard
                standardMessagingMode:
                  title: Async messaging
                  type: string
                  enum: [api-only, with-queue-worker]
                  enumNames:
                    - API only (no message worker)
                    - API + queue worker (SNS/SQS)
                  default: api-only
                  ui:widget: radio
                  ui:help: Queue worker provisions SNS/SQS and a background consumer for inbound messages.
              required:
                - standardMessagingMode
            - properties:
                cqrsArchitecture:
                  const: cqrs
                cqrsProjectionMode:
                  title: CQRS projection mode
                  type: string
                  enum: [sync, async]
                  enumNames:
                    - Synchronous projection (in-process)
                    - Asynchronous projection (SNS/SQS + message worker)
                  default: sync
                  ui:widget: radio
                  ui:help: Async provisions messaging resources and scales the message worker for read-model projections.
              required:
                - cqrsProjectionMode

    - title: AWS Configuration
      required:
        - awsAccountId
        - awsRegion
        - eksOidcProviderId
      properties:
        awsAccountId:
          title: AWS Account ID
          type: string
          default: "554479149941"
          ui:readonly: true
        awsRegion:
          title: AWS Region
          type: string
          default: "us-west-2"
          ui:readonly: true
        eksOidcProviderId:
          title: EKS OIDC Provider ID
          type: string
          pattern: "^[A-Z0-9]{32}$"
          default: CFA3B3060A916F62CB2F522C84B48422
          ui:readonly: true

    - title: Kubernetes Configuration
      properties:
        namespace:
          title: Kubernetes Namespace
          type: string
          pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
          default: ${{ parameters.name }}
          ui:widget: ReadonlyNamespaceField
          ui:readonly: true
        replicaCount:
          title: Initial Replicas
          type: number
          default: 2
          minimum: 1
          maximum: 10
        cpuRequests:
          title: CPU Requests
          type: string
          default: "256m"
        cpuLimits:
          title: CPU Limits
          type: string
          default: "512m"
        memoryRequests:
          title: Memory Requests
          type: string
          default: "384Mi"
        memoryLimits:
          title: Memory Limits
          type: string
          default: "576Mi"

    - title: Data Storage (Optional)
      description: Choose at most one data store. Aurora and DynamoDB create AWS resources and may incur costs.
      properties:
        dataStorage:
          title: Data storage type
          type: string
          enum: [none, aurora-minimal, aurora-standard, dynamodb]
          enumNames:
            - No database
            - Aurora PostgreSQL Serverless v2 — Minimal (0–1 ACU)
            - Aurora PostgreSQL Serverless v2 — Standard (0–2 ACU)
            - DynamoDB — On-demand
          default: none
          ui:widget: radio

    - title: Autoscaling Configuration
      properties:
        autoscalingEnabled:
          title: Enable Autoscaling
          type: boolean
          default: true
        autoscalingMinReplicas:
          title: Min Replicas
          type: number
          default: 2
          minimum: 1
          maximum: 10
        autoscalingMaxReplicas:
          title: Max Replicas
          type: number
          default: 4
          minimum: 2
          maximum: 20
        autoscalingTargetCPU:
          title: Target CPU Utilization (%)
          type: number
          default: 60
          minimum: 10
          maximum: 90

    - title: Networking Configuration
      properties:
        hostnames:
          title: Hostnames
          type: array
          items:
            type: string
          default: []
          ui:help: >-
            Optional public hostnames for the HTTPRoute (for example my-service.dev.zedelivery.in).
            Leave empty to scaffold without external routing; add hostnames later in GitOps values.yaml.
        gatewayName:
          title: Gateway Name
          type: string
          default: "consumer-gateway-private"
          ui:readonly: true
        gatewayNamespace:
          title: Gateway Namespace
          type: string
          default: "istio-gateway"
          ui:readonly: true

    - title: Health Check Configuration
      properties:
        healthCheckPath:
          title: Health Check Path
          type: string
          default: "/health"
        healthCheckInitialDelay:
          title: Initial Delay (seconds)
          type: number
          default: 20
        healthCheckTimeout:
          title: Timeout (seconds)
          type: number
          default: 10
        healthCheckFailureThreshold:
          title: Failure Threshold
          type: number
          default: 4

    - title: Ephemeral Environment (Optional)
      properties:
        ephemeralEnabled:
          title: Enable Ephemeral Environments
          type: boolean
          default: false
        ephemeralIngressHost:
          title: Ephemeral Ingress Host
          type: string
          default: ""
        ephemeralInternalHost:
          title: Ephemeral Internal Host
          type: string
          default: ""

  steps:
    - id: fetch-app-content
      name: Fetch Node.js CQRS application content
      action: fetch:template
      input:
        url: https://github.com/ab-inbev-ze-company/template-backstage-eks-nodejs-cqrs-app.git
        targetPath: ./repo-temp
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          squad: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          appOrganization: ab-inbev-ze-company
          awsAccountId: ${{ parameters.awsAccountId }}
          awsRegion: ${{ parameters.awsRegion }}
          eksOidcProviderId: ${{ parameters.eksOidcProviderId }}
          nodeVersion: "24"
          applicationPort: 3000
          releaseAwsAccountId: ${{ parameters.awsAccountId }}
          prodAwsAccountId: ${{ parameters.awsAccountId }}
          releaseBranch: "develop"
          prodBranch: "main"
          namespace: ${{ parameters.namespace or parameters.name }}
          replicaCount: ${{ parameters.replicaCount }}
          cpuRequests: ${{ parameters.cpuRequests }}
          cpuLimits: ${{ parameters.cpuLimits }}
          memoryRequests: ${{ parameters.memoryRequests }}
          memoryLimits: ${{ parameters.memoryLimits }}
          autoscalingEnabled: ${{ parameters.autoscalingEnabled }}
          autoscalingMinReplicas: ${{ parameters.autoscalingMinReplicas }}
          autoscalingMaxReplicas: ${{ parameters.autoscalingMaxReplicas }}
          autoscalingTargetCPU: ${{ parameters.autoscalingTargetCPU }}
          gitopsRepo: https://github.com/ab-inbev-ze-company/${{ parameters.gitopsChartRepo }}
          gitopsAppPath: ${{ 'applications/' + parameters.name }}
          gitopsBranch: ${{ parameters.gitopsBranch }}
          goldenLibraryOrganization: ab-inbev-ze-company
          hostnames: ${{ parameters.hostnames }}
          gatewayName: ${{ parameters.gatewayName }}
          gatewayNamespace: ${{ parameters.gatewayNamespace }}
          healthCheckPath: ${{ parameters.healthCheckPath }}
          healthCheckInitialDelay: ${{ parameters.healthCheckInitialDelay }}
          healthCheckTimeout: ${{ parameters.healthCheckTimeout }}
          healthCheckFailureThreshold: ${{ parameters.healthCheckFailureThreshold }}
          businessStructure: ze-delivery
          valueStream: ${{ parameters.owner }}
          costAppId: ${{ parameters.name }}
          costAppName: ${{ parameters.name }}
          costOwner: ${{ parameters.owner }}
          costSquad: ${{ parameters.owner }}
          costEnv: ${{ parameters.costEnv }}
          costTemplate: platform
          costCenter: ${{ parameters.costCenter }}
          costShared: ${{ parameters.costShared and 'true' or 'false' }}
          ephemeralEnabled: ${{ parameters.ephemeralEnabled }}
          ephemeralIngressHost: ${{ parameters.ephemeralIngressHost }}
          ephemeralInternalHost: ${{ parameters.ephemeralInternalHost }}
          environments: ${{ parameters.environments }}
          cqrsArchitecture: ${{ parameters.cqrsArchitecture }}
          cqrsProjectionMode: ${{ parameters.cqrsProjectionMode or 'sync' }}
          standardMessagingMode: ${{ parameters.standardMessagingMode or 'api-only' }}
          cqrsEnabled: ${{ parameters.cqrsArchitecture == 'cqrs' }}

    - id: write-crossplane-infra
      name: Write Crossplane infra manifests
      dependsOn: [fetch-app-content]
      action: custom:write-eks-crossplane-infra
      input:
        name: ${{ parameters.name }}
        owner: ${{ parameters.owner }}
        awsAccountId: ${{ parameters.awsAccountId }}
        awsRegion: ${{ parameters.awsRegion }}
        namespace: ${{ parameters.namespace or parameters.name }}
        eksOidcProviderId: ${{ parameters.eksOidcProviderId }}
        deletionPolicy: Orphan
        cqrsArchitecture: ${{ parameters.cqrsArchitecture }}
        cqrsProjectionMode: ${{ parameters.cqrsProjectionMode or 'sync' }}
        standardMessagingMode: ${{ parameters.standardMessagingMode or 'api-only' }}
        targetPath: repo-temp/infra

    - id: publish-app
      name: Publish monorepo (application + infra/)
      dependsOn: [fetch-app-content, write-crossplane-infra]
      action: custom:publish-github-api
      input:
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=ab-inbev-ze-company&repo=${{ parameters.name }}-app
        repoVisibility: private
        defaultBranch: main
        gitCommitMessage: 'Initial commit: Node.js CQRS EKS monorepo (app + Crossplane infra/, Golden Pipeline)'
        sourcePath: ./repo-temp

    - id: add-repo-creator-admin
      name: Grant repository admin to creator (GitHub user)
      dependsOn: [publish-app]
      action: custom:add-repo-collaborator-admin
      input:
        repoUrl: ${{ steps['publish-app'].output.remoteUrl }}
        permission: admin
        githubUsername: ${{ user.entity.metadata.annotations['github.com/user-login'] }}

    - id: register-entity-provider-catalog
      name: Register app in entity provider catalog (main)
      dependsOn: [publish-app, add-repo-creator-admin]
      action: custom:register-entity-provider-catalog
      input:
        remoteUrl: ${{ steps['publish-app'].output.remoteUrl }}
        defaultBranch: main

    - id: create-helm-charts
      name: Create Helm charts (workspace staging for GitOps commit)
      dependsOn: [publish-app]
      action: custom:create-helm-charts
      input:
        name: ${{ parameters.name }}
        awsAccountId: ${{ parameters.awsAccountId }}
        awsRegion: ${{ parameters.awsRegion }}
        eksOidcProviderId: ${{ parameters.eksOidcProviderId }}
        applicationPort: 3000
        replicaCount: ${{ parameters.replicaCount }}
        cpuRequests: ${{ parameters.cpuRequests }}
        cpuLimits: ${{ parameters.cpuLimits }}
        memoryRequests: ${{ parameters.memoryRequests }}
        memoryLimits: ${{ parameters.memoryLimits }}
        autoscalingEnabled: ${{ parameters.autoscalingEnabled }}
        autoscalingMinReplicas: ${{ parameters.autoscalingMinReplicas }}
        autoscalingMaxReplicas: ${{ parameters.autoscalingMaxReplicas }}
        autoscalingTargetCPU: ${{ parameters.autoscalingTargetCPU }}
        healthCheckPath: ${{ parameters.healthCheckPath }}
        healthCheckInitialDelay: ${{ parameters.healthCheckInitialDelay }}
        healthCheckTimeout: ${{ parameters.healthCheckTimeout }}
        healthCheckFailureThreshold: ${{ parameters.healthCheckFailureThreshold }}
        hostnames: ${{ parameters.hostnames }}
        gatewayName: ${{ parameters.gatewayName }}
        gatewayNamespace: ${{ parameters.gatewayNamespace }}
        owner: ${{ parameters.owner }}
        costAppId: ${{ parameters.name }}
        costAppName: ${{ parameters.name }}
        costOwner: ${{ parameters.owner }}
        costSquad: ${{ parameters.owner }}
        costEnv: ${{ parameters.costEnv }}
        costTemplate: platform
        costCenter: ${{ parameters.costCenter }}
        costShared: ${{ parameters.costShared and 'true' or 'false' }}
        gitOpsApplicationsParentFolder: ""
        enableDatabase: ${{ parameters.dataStorage == 'aurora-minimal' or parameters.dataStorage == 'aurora-standard' }}
        enableDynamodb: ${{ parameters.dataStorage == 'dynamodb' }}
        databaseName: applicationdb
        auroraMinCapacity: 0
        auroraMaxCapacity: ${{ parameters.dataStorage == 'aurora-standard' and 2 or 1 }}
        crossplaneDeletionPolicy: Orphan
        cqrsArchitecture: ${{ parameters.cqrsArchitecture }}
        cqrsProjectionMode: ${{ parameters.cqrsProjectionMode or 'sync' }}
        standardMessagingMode: ${{ parameters.standardMessagingMode or 'api-only' }}
        enableMessageWorker: ${{ (parameters.cqrsArchitecture == 'cqrs' and parameters.cqrsProjectionMode == 'async') or (parameters.cqrsArchitecture == 'standard' and parameters.standardMessagingMode == 'with-queue-worker') }}

    - id: publish-gitops-helm
      name: Publish platform GitOps Helm charts (main)
      dependsOn: [create-helm-charts]
      action: custom:publish-github-api
      input:
        repoUrl: github.com?owner=ab-inbev-ze-company&repo=${{ parameters.gitopsChartRepo }}
        defaultBranch: ${{ parameters.gitopsBranch }}
        sourcePath: ./helm-temp
        gitCommitMessage: 'chore(gitops): add ${{ parameters.name }} Helm chart'

    - id: debug-summary
      name: Summary
      dependsOn: [publish-gitops-helm, register-entity-provider-catalog]
      action: debug:log
      input:
        message: |
          Node.js CQRS EKS scaffold complete (single monorepo).

          Repository: ${{ parameters.name }}-app
          Published: ${{ steps['publish-app'].output.remoteUrl }}
          Architecture: ${{ parameters.cqrsArchitecture }} (${{ parameters.cqrsArchitecture == 'cqrs' and ('projection: ' + parameters.cqrsProjectionMode) or ('messaging: ' + parameters.standardMessagingMode) }})
          Namespace: ${{ parameters.namespace or parameters.name }}
          Platform GitOps repo: https://github.com/ab-inbev-ze-company/${{ parameters.gitopsChartRepo }}
          Helm charts: https://github.com/ab-inbev-ze-company/${{ parameters.gitopsChartRepo }}/tree/${{ parameters.gitopsBranch }}/applications/${{ parameters.name }}/dev
          Argo CD application: https://argo.zedelivery.in/applications/eks-consumer-dev-${{ parameters.name }}
          Entity provider catalog: ${{ steps['register-entity-provider-catalog'].output.catalogRegistrationUrl }}

          Next: review infra/ for Crossplane claims; Argo CD will sync once the Golden Pipeline updates image tags.
          CI: https://github.com/ab-inbev-ze-company/${{ parameters.name }}-app/actions

  output:
    links:
      - title: Repository (app + infra/)
        url: ${{ steps['publish-app'].output.remoteUrl }}
        icon: code
      - title: App catalog-info.yaml
        url: https://github.com/ab-inbev-ze-company/${{ parameters.name }}-app/blob/main/catalog-info.yaml
        icon: docs
      - title: Entity provider catalog (ze-idp-backstage-entity-provider)
        url: ${{ steps['register-entity-provider-catalog'].output.catalogRegistrationUrl }}
        icon: catalog
      - title: Platform GitOps charts (Helm)
        url: https://github.com/ab-inbev-ze-company/${{ parameters.gitopsChartRepo }}/tree/${{ parameters.gitopsBranch }}/applications/${{ parameters.name }}/dev
        icon: storage
      - title: Argo CD application
        url: https://argo.zedelivery.in/applications/eks-consumer-dev-${{ parameters.name }}
        icon: dashboard
